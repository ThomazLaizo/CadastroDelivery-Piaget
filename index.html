</head>
<body>
    <h1>Cadastro de Aplicativos de Delivery</h1>
    <form id = "formulario">
        <input type="text" id ="campoUm" placeholder="Escreva o nome do aplicativo">

    </form>
    <table>
        <thead id = "cabecalhoTabela">
            <th class = "dado">Nome</th>
            <th class = "dado">Pais</th>
        </thead>
        <tbody id = "corpoTabela">

        </tbody>
    </table>
</body>
